<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quizzes - Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="table-container">
    <h2>All Quizzes</h2>

    <a th:href="@{/admin/quiz/new}">
        <button>+ Create New Quiz</button>
    </a>
    <br><br>

    <table>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
            <th>Active</th>
            <th>Actions</th>
        </tr>
        <tr th:each="quiz : ${quizzes}">
            <td th:text="${quiz.id}"></td>
            <td th:text="${quiz.title}"></td>
            <td th:text="${quiz.description}"></td>
            <td th:text="${quiz.active}"></td>
            <td>
                <a th:href="@{'/admin/quiz/' + ${quiz.id} + '/questions'}">
                    <button>Manage Questions</button>
                </a>
            </td>
        </tr>
    </table>

    <br>
    <a th:href="@{/admin/dashboard}">Back to Dashboard</a>
</div>

</body>
</html>
